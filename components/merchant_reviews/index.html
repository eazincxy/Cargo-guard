<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reviews</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: #3a3a3a;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
  .rv { position: relative; padding: 12px 2px; border-top: 1px solid #f4f4f4; cursor: pointer;
    border-radius: 8px; transition: background-color 140ms ease-out; }
  .rv:first-child { border-top: 0; padding-top: 2px; }
  .rv:hover { background: #fafafa; }
  .rv:active { background: #f6f7f8; }
  .rv-line { display: flex; gap: 11px; }
  .rv-avatar { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
    background: #f2f2f2; color: #8f8f8f; font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; }
  .rv-main { flex: 1 1 auto; min-width: 0; }
  .rv-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .rv-name { font-size: 12.8px; font-weight: 700; color: #3a3a3a; }
  .rv-loc { font-size: 10.6px; color: #9a9a9a; }
  .rv-date { margin-left: auto; font-size: 10.9px; color: #a6a6a6; }
  .rv-stars { font-size: 11.5px; letter-spacing: 1px; margin: 2px 0 3px; }
  .on { color: #e08a3c; }
  .off { color: #e3e3e3; }
  .rv-text { font-size: 12.5px; color: #5f5f5f; line-height: 1.65; }
  .rv-hint { margin-top: 4px; font-size: 10.6px; color: #b0b0b0;
    display: inline-flex; align-items: center; gap: 5px; }
  .rv-trans { position: absolute; left: 41px; right: 2px; top: 34px; z-index: 6;
    margin: 0; padding: 9px 12px; background: #f7f8fa; border: 1px solid #eef0f3;
    border-radius: 10px; font-size: 12.5px; color: #4a4a4a; line-height: 1.6;
    box-shadow: 0 8px 22px rgba(17, 24, 39, .10); animation: trIn 160ms ease-out; }
  .rv-trans-label { font-size: 10.4px; color: #9a9a9a; margin-bottom: 3px; }
  @keyframes trIn { from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: none; } }
  .rv-empty { font-size: 12px; color: #9a9a9a; padding: 6px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var REVIEWS = [];
  var LABELS = {};
  var OPENED = {};

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function stars(n) {
    var out = "";
    for (var i = 1; i <= 5; i++) {
      out += '<span class="' + (i <= n ? "on" : "off") + '">★</span>';
    }
    return out;
  }

  function notifyHeight() {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: document.body.scrollHeight + 6
    }, "*");
  }

  function render() {
    var root = document.getElementById("root");
    if (!REVIEWS.length) {
      root.innerHTML = '<div class="rv-empty">' + esc(LABELS.empty || "") + "</div>";
      notifyHeight();
      return;
    }
    root.innerHTML = REVIEWS.map(function (r, i) {
      var trans = '<div class="rv-trans" style="display:' + (OPENED[i] ? "block" : "none") + '">' +
        '<div class="rv-trans-label">' + esc(LABELS.translation || "") + "</div>" +
        esc(r.trans ? r.trans : (LABELS.sameLang || "")) + "</div>";
      return '<div class="rv" data-i="' + i + '">' +
        trans +
        '<div class="rv-line">' +
          '<div class="rv-avatar">' + esc((r.author || "?").slice(0, 1).toUpperCase()) + "</div>" +
          '<div class="rv-main">' +
            '<div class="rv-head">' +
              '<span class="rv-name">' + esc(r.author) + "</span>" +
              '<span class="rv-loc">📍 ' + esc(r.location || "") + "</span>" +
              '<span class="rv-date">' + esc(r.date || "") + "</span>" +
            "</div>" +
            '<div class="rv-stars">' + stars(r.rating || 0) + "</div>" +
            '<div class="rv-text">' + esc(r.text || "") + "</div>" +
            '<div class="rv-hint">' + esc(LABELS.click || "") + "</div>" +
          "</div>" +
        "</div></div>";
    }).join("");
    notifyHeight();
  }

  document.addEventListener("click", function (e) {
    var node = e.target.closest ? e.target.closest(".rv") : null;
    if (!node) return;
    var i = node.getAttribute("data-i");
    OPENED[i] = !OPENED[i];
    render();
  });

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (Array.isArray(args.reviews)) {
      REVIEWS = args.reviews;
      LABELS = args.labels || {};
      render();
    }
  });

  setTimeout(notifyHeight, 60);
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
})();
</script>
</body>
</html>
