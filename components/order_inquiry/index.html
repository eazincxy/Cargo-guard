<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Order Inquiry</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    color: #333333; font-size: 13px;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { padding: 2px 2px 6px; }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .search {
    flex: 1 1 260px; min-width: 180px; height: 32px; padding: 0 12px;
    border: 1px solid #e2e2e2; border-radius: 8px; background: #ffffff;
    color: #333333; font-size: 13px; outline: none; transition: border-color .15s ease;
  }
  .search::placeholder { color: #a8a8a8; }
  .search:focus { border-color: #c4c4c4; }

  .dates { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .dates .label { color: #9a9a9a; font-size: 12px; }
  .date {
    height: 32px; padding: 0 8px; border: 1px solid #e2e2e2; border-radius: 8px;
    background: #ffffff; color: #444444; font-size: 12px; outline: none;
  }
  .date:focus { border-color: #c4c4c4; }
  .dash { color: #bdbdbd; }

  .tabs { display: flex; gap: 20px; border-bottom: 1px solid #ececec; }
  .tab {
    position: relative; padding: 8px 2px 9px; font-size: 12.5px; color: #8c8c8c;
    background: none; border: 0; cursor: pointer; transition: color .15s ease;
  }
  .tab:hover { color: #4a4a4a; }
  .tab.active { color: #2f2f2f; font-weight: 600; }
  .tab.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: #9a9a9a; border-radius: 2px;
  }
  .tab .count { color: #b0b0b0; font-weight: 400; }

  .table-wrap { padding-top: 2px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    text-align: left; font-size: 11.5px; font-weight: 600; color: #9a9a9a;
    letter-spacing: .3px; padding: 8px 10px; border-bottom: 1px solid #ededed; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  thead th:last-child { text-align: right; }
  tbody td {
    padding: 9px 10px; border-bottom: 1px solid #f2f2f2; color: #3a3a3a;
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 固定各列宽度，保证最右侧的 Action 列完整露出 */
  thead th:nth-child(1), tbody td:nth-child(1) { width: 96px; }
  thead th:nth-child(3), tbody td:nth-child(3) { width: 26%; }
  thead th:nth-child(4), tbody td:nth-child(4) { width: 138px; }
  thead th:nth-child(5), tbody td:nth-child(5) { width: 96px; }
  thead th:nth-child(6), tbody td:nth-child(6) { width: 78px; }
  thead th:last-child, tbody td:last-child { width: 96px; overflow: visible; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: #fafafa; }
  td.oid { color: #2f2f2f; font-weight: 600; }
  td:last-child { text-align: right; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    background: #f1f1f1; color: #6f6f6f; font-size: 11px; font-weight: 500; line-height: 18px;
  }

  .linkbtn {
    height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid #e2e2e2;
    background: #ffffff; color: #333333; font-size: 12px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .linkbtn:hover { background: #f4f4f4; border-color: #d4d4d4; }

  .empty { padding: 32px 10px; text-align: center; color: #a5a5a5; font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <input id="q" class="search" type="text" placeholder="Search by order ID, merchant or product" />
    <div class="dates">
      <span class="label">Date</span>
      <input id="d1" class="date" type="date" />
      <span class="dash">–</span>
      <input id="d2" class="date" type="date" />
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="order">Order <span class="count" id="cOrder">(0)</span></button>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No matching records.</div>
  </div>
</div>

<script>
(function () {
  var ORDERS = [];
  var ACTION = "View Detail";
  var state = { tab: "order", keyword: "", from: "", to: "" };
  var seq = 0;

  var tbody = document.getElementById("tbody");
  var thead = document.getElementById("thead");
  var empty = document.getElementById("empty");

  function post(type, payload) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, payload), "*");
  }

  function setHeight() {
    post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });
  }

  function match(o) {
    var kw = state.keyword.toLowerCase();
    if (kw) {
      var hit = (o.id + " " + o.merchant + " " + o.product).toLowerCase().indexOf(kw) >= 0;
      if (!hit) return false;
    }
    var day = (o.time || "").slice(0, 10);
    if (state.from && day < state.from) return false;
    if (state.to && day > state.to) return false;
    return true;
  }

  function badge(status) {
    return '<span class="badge">' + (status || "-") + "</span>";
  }

  function viewBtn(id) {
    return '<button class="linkbtn" data-oid="' + id + '">' + ACTION + "</button>";
  }

  function render() {
    var rows = ORDERS.filter(match);
    document.getElementById("cOrder").textContent = "(" + rows.length + ")";

    var head = ["Order ID", "Merchant", "Product", "Time", "Amount", "Status", "Action"];

    thead.innerHTML = "<tr>" + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") + "</tr>";

    if (!rows.length) {
      tbody.innerHTML = "";
      empty.style.display = "block";
      setHeight();
      return;
    }
    empty.style.display = "none";

    tbody.innerHTML = rows.map(function (o) {
      return "<tr>" +
        '<td class="oid">' + o.id + "</td>" +
        "<td>" + o.merchant + "</td>" +
        "<td>" + o.product + "</td>" +
        "<td>" + o.time + "</td>" +
        "<td>" + o.amount + "</td>" +
        "<td>" + badge(o.status) + "</td>" +
        "<td>" + viewBtn(o.id) + "</td>" +
      "</tr>";
    }).join("");
    setHeight();
  }

  function syncState() {
    state.keyword = document.getElementById("q").value.trim();
    state.from = document.getElementById("d1").value;
    state.to = document.getElementById("d2").value;
    render();
  }

  document.getElementById("q").addEventListener("input", syncState);

  document.getElementById("d1").addEventListener("change", syncState);
  document.getElementById("d2").addEventListener("change", syncState);

  tbody.addEventListener("click", function (e) {
    var btn = e.target.closest(".linkbtn");
    if (!btn) return;
    seq += 1;
    post("streamlit:setComponentValue", {
      value: { order_id: btn.getAttribute("data-oid"), seq: seq },
      dataType: "json"
    });
  });

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (Array.isArray(args.orders)) ORDERS = args.orders;
    if (args.action_label) ACTION = args.action_label;
    render();
    if (!window.__cgReady) {
      window.__cgReady = true;
      post("streamlit:componentReady", { apiVersion: 1 });
    }
  });

  render();
  post("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
