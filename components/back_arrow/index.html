<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .back {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0; margin: 0;
    border: 0; background: transparent; color: #6b6b6b;
    cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent;
  }
  .back svg { width: 22px; height: 22px; display: block; }
  .back:hover { color: #333333; }
</style>
</head>
<body>
<button class="back" id="back" aria-label="back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 5 8 12 15 19"></polyline>
  </svg>
</button>
<script>
  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 34 });

  document.getElementById("back").addEventListener("click", function () {
    send("streamlit:setComponentValue", { value: { action: "back", seq: Date.now() }, dataType: "json" });
  });
</script>
</body>
</html>
