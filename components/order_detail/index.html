<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Detail</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; color: #3a3a3a; }
  .wrap { padding: 0 2px 2px; }
  .back { display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; margin: 0 0 6px 0; padding: 0;
    border: 0; background: transparent; color: #6b6b6b;
    cursor: pointer; border-radius: 6px; }
  .back svg { width: 22px; height: 22px; display: block; }
  .back:hover { color: #333333; }

  .card { background: #fff; border: 1px solid #ececec; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 10px; }

  /* 1. 状态卡（清关中可点击，进入物流动态页） */
  .status-card.clickable { cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease; }
  .status-card.clickable:hover { border-color: #dcdcdc;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .05); }
  .status-hint { margin-left: auto; display: flex; align-items: center; gap: 2px;
    font-size: 11.5px; color: #9a9a9a; }
  .status-hint .chev { font-size: 13px; line-height: 1; }
  .status-card.clickable:hover .status-hint { color: #5f5f5f; }
  .status-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .pin { width: 16px; height: 16px; flex: 0 0 16px; color: #2f9e5f; }
  .status-text { color: #2f9e5f; font-size: 14px; font-weight: 600; }
  .addr { font-size: 12.5px; color: #4a4a4a; line-height: 1.6; }
  .sender { font-size: 11.5px; color: #9a9a9a; margin-bottom: 2px; }
  .person { font-size: 12px; color: #8f8f8f; margin-top: 3px; }

  /* 2. 店铺行（可点击进入商家主页） */
  .shop { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .shop-card, .product-card { transition: border-color .15s ease, box-shadow .15s ease; }
  .shop-card:hover, .product-card:hover { border-color: #dcdcdc; box-shadow: 0 2px 10px rgba(0, 0, 0, .05); }
  .product-card { cursor: pointer; }
  .avatar { width: 26px; height: 26px; border-radius: 8px; background: #f2f2f2;
    color: #8f8f8f; font-size: 12px; font-weight: 700; flex: 0 0 26px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shop-name { font-size: 13px; font-weight: 600; color: #3a3a3a; }
  .shop-arrow { margin-left: auto; color: #b5b5b5; font-size: 15px; line-height: 1; }

  /* 3. 商品卡 */
  .prod { display: flex; gap: 12px; }
  .thumb { flex: 0 0 68px; width: 68px; height: 68px; border-radius: 10px;
    background: #f3f3f3; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #a6a6a6; font-size: 20px; font-weight: 700; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prod-info { flex: 1 1 auto; min-width: 0; }
  .title { font-size: 13px; font-weight: 600; color: #2f2f2f; margin-bottom: 3px; }
  .spec { font-size: 11.5px; color: #9a9a9a; margin-bottom: 5px; }
  .price-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #9a9a9a; }
  .orig { color: #9a9a9a; }
  .qty { color: #9a9a9a; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 5px;
    background: #f4f4f4; color: #8a8a8a; font-size: 10.5px; line-height: 17px;
    border: 1px solid #ededed; }

  .pay-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding-top: 9px; border-top: 1px solid #f2f2f2; }
  .pay-label { font-size: 11.5px; color: #9a9a9a; }
  .pay-value { font-size: 15px; font-weight: 700; color: #e08a3c; }

  /* 4. 可折叠订单信息（原生 details，点击必然展开） */
  .info-head { display: flex; align-items: center; gap: 8px;
    user-select: none; list-style: none; }
  .info-head::-webkit-details-marker { display: none; }
  .info-title { font-size: 12.5px; font-weight: 600; color: #3a3a3a; }
  .copy { height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid #e8e8e8;
    background: #fff; color: #8a8a8a; font-size: 10.5px; cursor: pointer; }
  .copy:hover { background: #f7f7f7; }
  .caret { margin-left: auto; color: #b5b5b5; font-size: 11px;
    transition: transform .22s ease; }
  .info-card[open] .caret { transform: rotate(180deg); }

  .info-body { animation: infoIn .24s ease-out; }
  @keyframes infoIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row { display: flex; justify-content: space-between; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 11.5px; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: #9a9a9a; white-space: nowrap; }
  .row .v { color: #3a3a3a; text-align: right; word-break: break-all; }

  /* 统一按压反馈：hover 上浮 + 阴影，active 缩放，触屏不粘滞 */
  .back, .status-card.clickable, .shop-card, .product-card, .thumb, .copy {
    transition: transform 140ms ease-out, box-shadow 140ms ease-out,
                border-color 140ms ease-out, color 140ms ease-out, background 140ms ease-out;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @media (hover: hover) and (pointer: fine) {
    .status-card.clickable:hover, .shop-card:hover, .product-card:hover, .copy:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(17, 24, 39, .10);
    }
  }
  .back:active, .status-card.clickable:active, .shop-card:active, .product-card:active,
  .thumb:active, .copy:active {
    transform: scale(.97);
    box-shadow: 0 2px 6px rgba(17, 24, 39, .10);
  }
  .copy:disabled { transform: none; box-shadow: none; }
  @media (hover: none) {
    .status-card.clickable:hover, .shop-card:hover, .product-card:hover, .copy:hover {
      transform: none; box-shadow: none;
    }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script>
(function () {
  var ORDER = {};
  var LANG = "zh";
  var SEQ = 0;

  var L = {
    zh: { paid: "实付价", info: "订单信息", copy: "复制",
      copied: "已复制", pay: "支付方式", recv: "收货信息", created: "创建时间",
      paidAt: "付款时间", shipped: "发货时间", signed: "签收时间", fast: "极速退款",
      send: "寄件信息", sender: "寄件人", tracking: "物流单号", shipFrom: "寄件地",
      return7: "7天无理由退货", logistics: "查看物流" },
    en: { paid: "Paid", info: "Order information", copy: "Copy",
      copied: "Copied", pay: "Payment method", recv: "Shipping info", created: "Created",
      paidAt: "Paid at", shipped: "Shipped at", signed: "Signed at", fast: "Fast refund",
      send: "Sender info", sender: "Sender", tracking: "Tracking No.", shipFrom: "Ship from",
      return7: "7-day free return", logistics: "Track shipment" },
    ja: { paid: "支払額", info: "注文情報", copy: "コピー",
      copied: "コピー済み", pay: "支払方法", recv: "配送先", created: "作成日時",
      paidAt: "支払日時", shipped: "発送日時", signed: "受取日時", fast: "迅速返金",
      send: "発送元情報", sender: "差出人", tracking: "追跡番号", shipFrom: "発送元",
      return7: "7日間返品可", logistics: "物流を見る" },
    ko: { paid: "결제 금액", info: "주문 정보", copy: "복사",
      copied: "복사됨", pay: "결제 수단", recv: "배송 정보", created: "생성 시간",
      paidAt: "결제 시간", shipped: "발송 시간", signed: "수령 시간", fast: "빠른 환불",
      send: "발송 정보", sender: "발송인", tracking: "운송장 번호", shipFrom: "발송지",
      return7: "7일 무이유 반품", logistics: "배송 조회" },
    fr: { paid: "Payé", info: "Informations", copy: "Copier",
      copied: "Copié", pay: "Paiement", recv: "Livraison", created: "Créé",
      paidAt: "Payé le", shipped: "Expédié le", signed: "Reçu le", fast: "Remboursement rapide",
      send: "Expéditeur", sender: "Expéditeur", tracking: "N° de suivi", shipFrom: "Expédié depuis",
      return7: "Retour 7 jours", logistics: "Suivre" }
  };

  function t(key) {
    var pack = L[LANG] || L.zh;
    return pack[key] || (L.en[key] || key);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function post(value) {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue",
      value: value, dataType: "json" }, "*");
  }

  function notifyHeight() {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight",
      height: document.body.scrollHeight + 8 }, "*");
  }

  function render() {
    var o = ORDER;
    var pinColor = o.statusGreen ? "#2f9e5f" : "#111111";
    var thumb = o.image
      ? '<div class="thumb" id="thumb"><img src="' + o.image + '" alt="" /></div>'
      : '<div class="thumb" id="thumb">' + esc(o.imageInitial || "?") + "</div>";
    var avatar = o.shopAvatar
      ? '<span class="avatar"><img src="' + o.shopAvatar + '" alt="" /></span>'
      : '<span class="avatar">' + esc(o.shopInitial || "?") + "</span>";

    var rows = [
      [t("pay"), o.payMethod],
      [t("recv"), o.shipTo],
      [t("created"), o.created],
      [t("paidAt"), o.paidAt],
      [t("shipped"), o.shipped],
      [t("signed"), o.signed]
    ].map(function (r) {
      return '<div class="row"><span class="k">' + esc(r[0]) + '</span><span class="v">' +
        esc(r[1] || "—") + "</span></div>";
    }).join("");

    document.getElementById("root").innerHTML =
      '<button class="back" id="backBtn" aria-label="Back">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>' +
      "</button>" +
      '<div class="card status-card clickable" id="statusCard">' +
        '<div class="status-top">' +
          '<svg class="pin" style="color:' + pinColor + '" viewBox="0 0 24 24" fill="none" ' +
            'stroke="currentColor" stroke-width="1.8" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/>' +
            '<circle cx="12" cy="10" r="2.6"/></svg>' +
          '<span class="status-text" style="color:' + pinColor + '">' + esc(o.status) + "</span>" +
          '<span class="status-hint">' + esc(t("logistics")) +
            '<span class="chev">›</span></span>' +
        "</div>" +
        '<div class="sender">' + esc(t("shipFrom")) + "：" + esc(o.shipFrom) + "</div>" +
        '<div class="addr">' + esc(o.address) + "</div>" +
        '<div class="person">' + esc(o.receiver) + "　" + esc(o.phone) + "</div>" +
      "</div>" +

      '<div class="card shop-card" id="shopCard">' +
        '<div class="shop"><span class="avatar-wrap">' + avatar + "</span>" +
          '<span class="shop-name">' + esc(o.shop) + "</span>" +
          '<span class="shop-arrow">›</span></div>' +
      "</div>" +

      '<div class="card product-card" id="productCard">' +
        '<div class="prod">' + thumb +
          '<div class="prod-info">' +
            '<div class="title">' + esc(o.title) + "</div>" +
            '<div class="spec">' + esc(o.spec) + "</div>" +
            '<div class="price-row"><span class="orig">' + esc(o.origPrice) + "</span>" +
              '<span class="qty">× ' + esc(o.qty) + "</span></div>" +
            '<div class="tags"><span class="tag">' + esc(t("fast")) + "</span>" +
              '<span class="tag">' + esc(t("return7")) + "</span></div>" +
          "</div>" +
        "</div>" +
        '<div class="pay-bar">' +
          '<span class="pay-label">' + esc(t("paid")) + "</span>" +
          '<span class="pay-value">' + esc(o.paidPrice) + "</span>" +
        "</div>" +
      "</div>" +

      '<div class="card info-card" id="infoCard">' +
        '<div class="info-head">' +
          '<span class="info-title">' + esc(t("info")) + "</span>" +
          '<button class="copy" id="copyBtn">' + esc(t("copy")) + "</button>" +
        "</div>" +
        '<div class="info-body">' + rows + "</div>" +
      "</div>";

    bind();
    notifyHeight();
  }

  function bind() {
    var copyBtn = document.getElementById("copyBtn");
    copyBtn.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (navigator.clipboard) navigator.clipboard.writeText(ORDER.id || "");
      copyBtn.textContent = t("copied");
      setTimeout(function () { copyBtn.textContent = t("copy"); }, 1200);
    });

    document.getElementById("productCard").addEventListener("click", function () {
      post({ order_id: ORDER.id, action: "product", seq: ++SEQ });
    });

    var statusCard = document.getElementById("statusCard");
    if (statusCard) {
      statusCard.addEventListener("click", function () {
        post({ order_id: ORDER.id, action: "logistics", seq: ++SEQ });
      });
    }

    document.getElementById("shopCard").addEventListener("click", function () {
      post({ order_id: ORDER.id, action: "merchant", seq: ++SEQ });
    });

    document.getElementById("backBtn").addEventListener("click", function () {
      post({ action: "back", seq: ++SEQ });
    });

    // 内容高度变化时同步 iframe 高度，保证页面可上下滑动且不被裁掉
    notifyHeight();
  }

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (args.order) {
      ORDER = args.order;
      LANG = args.lang || "zh";
      render();
    }
  });

  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
})();
</script>
</body>
</html>
