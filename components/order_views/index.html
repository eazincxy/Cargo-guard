<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orders</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; color: #333333;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
  .app { padding: 2px 2px 8px; }

  .card {
    display: flex; gap: 12px;
    background: #ffffff; border: 1px solid #ececec; border-radius: 12px;
    padding: 12px; margin-bottom: 10px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .card:hover { border-color: #dedede; background: #fcfcfc; }

  .thumb {
    flex: 0 0 64px; width: 64px; height: 64px; border-radius: 10px;
    background: #f3f3f3; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #9a9a9a; overflow: hidden;
    cursor: pointer; transition: background .15s ease;
  }
  .thumb:hover { background: #ebebeb; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card-main { flex: 1 1 auto; min-width: 0; }

  .shop { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .avatar {
    width: 20px; height: 20px; border-radius: 6px; background: #f1f1f1;
    color: #8f8f8f; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
    flex: 0 0 20px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shop-name { font-size: 12px; color: #6f6f6f; }
  .oid { font-size: 11px; color: #b0b0b0; margin-left: auto; }

  .title { font-size: 13px; font-weight: 600; color: #2f2f2f; margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spec { font-size: 11.5px; color: #9a9a9a; margin-bottom: 6px; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .tag-svc {
    display: inline-block; padding: 1px 7px; border-radius: 5px;
    background: #eef6f0; color: #4f7a5c; font-size: 10.5px; line-height: 17px;
    border: 1px solid #e2efe6;
  }
  .tag-svc.neg {
    background: #fdecec; color: #b3382f; border-color: #f7d6d3;
  }

  .meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: #9a9a9a; }
  .meta .unit { color: #a8a8a8; }
  .meta .price { margin-left: auto; color: #2f2f2f; font-weight: 600; font-size: 13px; }

  .card-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .btn {
    height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid #e2e2e2;
    background: #ffffff; color: #444444; font-size: 12px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: #f5f5f5; border-color: #d5d5d5; }
  .btn.small { height: 26px; padding: 0 10px; font-size: 11.5px; }

  .status-badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: #f3f3f3; color: #6f6f6f; font-size: 10.5px; border: 1px solid #eaeaea;
  }
  .tl { margin-top: 8px; }
  .tl summary {
    list-style: none; cursor: pointer; display: flex; justify-content: flex-end;
    align-items: center; gap: 5px;
  }
  .tl summary::-webkit-details-marker { display: none; }
  .tl-caret { color: #b0b0b0; font-size: 10px; }
  .tl-body { margin-top: 8px; border-left: 2px solid #ececec; padding-left: 10px; }
  .tl-node { margin-bottom: 8px; }
  .tl-node:last-child { margin-bottom: 0; }
  .tl-time { font-size: 11px; color: #a8a8a8; }
  .tl-label { font-size: 12px; color: #6f6f6f; }
  .tl-label.now { color: #2f2f2f; font-weight: 600; }

  .empty { padding: 24px; text-align: center; color: #a8a8a8; font-size: 12px; }
</style>
</head>
<body>
<div class="app"><div id="listView"></div></div>

<script>
(function () {
  var ORDERS = [];
  var FOCUS = "";
  var EMBEDDED = window.parent !== window;
  var SEQ = 0;
  var listView = document.getElementById("listView");

  function post(value) {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue",
      value: value, dataType: "json" }, "*");
  }

  function notifyHeight() {
    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight",
      height: document.body.scrollHeight + 8 }, "*");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function tagsHtml(tags) {
    if (!tags || !tags.length) return "";
    return '<div class="tags">' + tags.map(function (t) {
      var obj = (t && typeof t === "object") ? t : { text: t, kind: "pos" };
      return '<span class="tag-svc ' + (obj.kind === "neg" ? "neg" : "") + '">' +
        esc(obj.text) + "</span>";
    }).join("") + "</div>";
  }

  function thumbHtml(o, idx) {
    if (o.image) {
      return '<div class="thumb" data-thumb="' + idx + '"><img src="' + o.image + '" alt="" /></div>';
    }
    return '<div class="thumb" data-thumb="' + idx + '">' + esc(o.imageInitial || "?") + "</div>";
  }

  function timelineHtml(o) {
    var badge = '<span class="status-badge">' + esc(o.status) + "</span>";
    if (!o.timeline || !o.timeline.length) return '<div class="tl">' + badge + "</div>";
    var nodes = o.timeline.map(function (n) {
      return '<div class="tl-node"><div class="tl-time">' + esc(n.time) + "</div>" +
        '<div class="tl-label' + (n.last ? " now" : "") + '">' + esc(n.label) + "</div></div>";
    }).join("");
    return '<details class="tl"><summary>' + badge + '<span class="tl-caret">▾</span></summary>' +
      '<div class="tl-body">' + nodes + "</div></details>";
  }

  function focusCard() {
    if (!FOCUS) return;
    var idx = -1;
    for (var i = 0; i < ORDERS.length; i++) {
      if (ORDERS[i] && ORDERS[i].id === FOCUS) { idx = i; break; }
    }
    if (idx < 0) return;
    var el = listView.querySelectorAll(".card")[idx];
    if (!el) return;
    FOCUS = "";
    // 先把卡片滚到 iframe 可视区中部（若 iframe 内部可滚动）
    try { el.scrollIntoView({ block: "center", behavior: "auto" }); } catch (err) {}
    try {
      var fr = window.frameElement;
      if (!fr) return;
      var p = window.parent;
      var r = el.getBoundingClientRect();
      var frRect = fr.getBoundingClientRect();
      var offset = frRect.top + r.top - 120;
      var doc = p.document;
      var cands = [
        doc.querySelector('[data-testid="stMain"]'),
        doc.querySelector('[data-testid="stAppViewContainer"]'),
        doc.querySelector('[data-testid="stMainBlockContainer"]'),
        doc.scrollingElement
      ];
      var scrolled = false;
      for (var i = 0; i < cands.length; i++) {
        var c = cands[i];
        if (c && c.scrollHeight > c.clientHeight + 2) {
          c.scrollTop += offset;
          scrolled = true;
          break;
        }
      }
      if (!scrolled) p.scrollTo(0, p.scrollY + offset);
    } catch (err) {}
  }

  function renderList() {
    if (!ORDERS.length) {
      listView.innerHTML = '<div class="empty">No orders</div>';
      notifyHeight();
      return;
    }
    listView.innerHTML = ORDERS.map(function (o, i) {
      return '<div class="card order-card" data-idx="' + i + '">' +
        thumbHtml(o, i) +
        '<div class="card-main">' +
          '<div class="shop">' +
            '<span class="avatar">' +
              (o.shopAvatar ? '<img src="' + o.shopAvatar + '" alt="" />' : esc(o.shopInitial || "?")) +
            "</span>" +
            '<span class="shop-name">' + esc(o.shop) + "</span>" +
            '<span class="oid">' + esc(o.id) + "</span>" +
          "</div>" +
          '<div class="title">' + esc(o.title) + "</div>" +
          '<div class="spec">' + esc(o.spec) + "</div>" +
          tagsHtml(o.tags) +
          '<div class="meta"><span>' + esc(o.date) + "</span><span>× " + esc(o.qty) + "</span>" +
            '<span class="unit">' + esc(o.unitPrice) + "</span>" +
            '<span class="price">' + esc(o.totalPrice) + "</span></div>" +
          timelineHtml(o) +
          '<div class="card-actions">' +
            '<button class="btn small" data-act="detail" data-idx="' + i + '">View Detail</button>' +
          "</div>" +
        "</div>" +
      "</div>";
    }).join("");
    notifyHeight();
  }

  listView.addEventListener("click", function (e) {
    var act = e.target.closest("[data-act]");
    if (act) {
      e.stopPropagation();
      var o = ORDERS[Number(act.getAttribute("data-idx"))];
      if (o) post({ order_id: o.id, action: act.getAttribute("data-act"), seq: ++SEQ });
      return;
    }
    var thumb = e.target.closest("[data-thumb]");
    if (thumb) {
      e.stopPropagation();
      var t = ORDERS[Number(thumb.getAttribute("data-thumb"))];
      if (t) post({ order_id: t.id, action: "product", seq: ++SEQ });
      return;
    }
    var card = e.target.closest(".card");
    if (card) {
      var c = ORDERS[Number(card.getAttribute("data-idx"))];
      if (c) post({ order_id: c.id, action: "detail", seq: ++SEQ });
    }
  });

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    if (Array.isArray(args.orders)) {
      ORDERS = args.orders;
      if (typeof args.focus === "string") FOCUS = args.focus;
      renderList();
      setTimeout(focusCard, 80);
    }
  });

  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  renderList();
})();
</script>
</body>
</html>
