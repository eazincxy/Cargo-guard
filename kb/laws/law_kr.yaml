law_id: law-kr-01
country: 韩国
country_code: KR
law_name: 电子商务等消费者保护法 第17条（청약철회 预约撤销权）
applicable_scope: 线上通信交易、跨境直邮卖给韩国消费者
core_rule:
  cooling_period: 7 days
  start_from: 签收日
  right: 法定预约撤销权，单纯不喜欢可申请；格式条款单方面剥夺无效
  freight_rule: 行使法定撤销权，退回运费原则上买家承担；商家责任情形商家承担
exception:
  - 商品已使用消耗、价值显著下降（仅拆包装查验不丧失权利）
  - 商家未提前单独明确告知退货限制时，即使已使用仍可主张
notice_requirement: 退货限制必须提前单独明确告知，否则无效
refund_deadline: 以法律与商家公示政策为准
complaint_channel: 韩国消费者院 KCA
