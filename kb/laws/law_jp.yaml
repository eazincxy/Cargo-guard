law_id: law-jp-01
country: 日本
country_code: JP
law_name: 消费者契约法（冷却期／クーリング・オフ）
applicable_scope: 访问贩卖、电话推销等特定交易类型；网上购物（通信販売）不适用冷却期
core_rule:
  cooling_period: 网购无法定冷却期
  start_from: 不适用
  right: 网上购物（通信販売）没有法定无理由退货权，退货以商家公示规则为准，商家有权拒绝单纯"不喜欢"的退货
  freight_rule: 商家同意退货时，退回运费按商家条款或双方约定；商家责任（破损、错发、描述不符）由商家承担
exception:
  - 冷却期仅适用于访问贩卖、电话推销、连锁销售等特定交易类型，不适用于网络邮购
notice_requirement: 商家公示的退货规则需清晰可查，但未承诺无理由退货不等于存在法定权利
refund_deadline: 以商家公示政策为准
complaint_channel: 消费者厅 / 国民生活中心
