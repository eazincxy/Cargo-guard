law_id: law-jp-01
country: 日本
country_code: JP
law_name: 消费者契约法（通信贩卖冷却期 クーリングオフ）
applicable_scope: 通信贩卖（网络邮购）、跨境直邮卖给日本消费者
core_rule:
  cooling_period: 8 days
  start_from: 签收日
  right: 无理由解除契约退货；商品页没写支持无理由不等于丧失法定权利
  freight_rule: 冷却解除退货，跨境退回运费通常买家承担
exception:
  - 商家下单页面清晰单独提示并取得买家明确同意放弃冷却期
  - 贴身内衣、定制商品、生鲜、开封后易变质品类
notice_requirement: 排除冷却期必须清晰提示并取得买家明确同意，否则不能排除
refund_deadline: 以商家公示政策为准
complaint_channel: 消费者厅 / 国民生活中心
