law_id: law-th-01
country: 泰国
country_code: TH
law_name: 消费者保护法（直邮网购场景）
applicable_scope: 线上远程购物、跨境直邮卖给泰国消费者
core_rule:
  cooling_period: 无强制法定无理由退货期
  start_from: 不适用
  right: 直邮网购不当然享有法定冷静期，退货以商家公示条款为准，商家可拒绝单纯"不喜欢"的退货
  freight_rule: 商家同意退货时退回运费按商家条款；商家责任（破损、错发、描述不符）由商家承担运费
exception:
  - 定制商品
  - 生鲜、贴身卫生耗材
  - 商品明显使用磨损、价值大幅下降
notice_requirement: 商家退货限制需提前清晰告知，但未承诺不等于存在法定无理由退货权
refund_deadline: 商家同意退货后按其政策退款
complaint_channel: OCPB 泰国消费者保护委员会，热线 1166
