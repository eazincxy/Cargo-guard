<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 90 580 290" width="1040" height="520" role="img" aria-label="CargoGuard startup animation">
  <style>
    /* 1. 航线描边动画：从左往右画出，0s → 0.9s（黑色细线，位于盾牌正上方） */
    .cg-route {
      fill: none;
      stroke: #000000;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: cgDrawRoute 0.9s ease-out 0s forwards;
    }
    @keyframes cgDrawRoute {
      to { stroke-dashoffset: 0; }
    }

    /* 2. 图标淡入：包裹 → JP → KR → TH → DE → GB → US，0.9s → 1.87s */
    .cg-icon {
      fill: none;
      stroke: #000000;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      animation: cgFadeIn 0.25s ease-out both;
    }
    @keyframes cgFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* 3. 盾牌淡入：1.8s → 2.05s，节奏与其他图标一致 */
    .cg-shield {
      fill: none;
      stroke: #000000;
      stroke-width: 1.8;
      stroke-linejoin: round;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: cgFadeIn 0.25s ease-out 1.8s both;
    }

    /* 4. 主标题淡入：2.05s → 2.33s */
    .cg-title {
      fill: #000000;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 2px;
      text-anchor: middle;
      opacity: 0;
      animation: cgRiseIn 0.28s ease-out 2.05s both;
    }

    /* 5. 副标题淡入：2.28s → 2.53s */
    .cg-subtitle {
      fill: #000000;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 1.2px;
      text-anchor: middle;
      opacity: 0;
      animation: cgRiseIn 0.25s ease-out 2.28s both;
    }
    @keyframes cgRiseIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* hover 缩放作用于内层可见元素：fill-box 只含自身可见内容（不含透明 hit-area），
       center 即视觉中心，缩放时不产生位移；外层分组只负责光标与外发光 */
    .cg-nav-item, .cg-shield-item, .cg-flag-item { cursor: pointer; }
    .cg-icon, .cg-shield {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 180ms ease-out, stroke-width 180ms ease-out;
    }
    .cg-flag-item .cg-icon { transition-duration: 200ms; }
    .cg-nav-item:hover .cg-icon { transform: scale(1.08); stroke-width: 1.65; }
    .cg-flag-item:hover .cg-icon { transform: scale(1.06); }
    .cg-shield-item:hover .cg-shield { transform: scale(1.08); stroke-width: 1.95; }
    .cg-nav-item:active .cg-icon, .cg-shield-item:active .cg-shield { transform: scale(.97) !important; }
    /* 柔和外发光作用于外层分组，不影响位置 */
    .cg-nav-item:hover, .cg-shield-item:hover {
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .72))
              drop-shadow(0 3px 6px rgba(17, 24, 39, .10));
    }
    .cg-flag-item:hover {
      filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .72))
              drop-shadow(0 3px 6px rgba(17, 24, 39, .10));
    }
    .cg-nav-item:active, .cg-shield-item:active { filter: none; }
    .cg-hit-area { fill: transparent; stroke: none; pointer-events: all; }

    @media (hover: none) {
      .cg-nav-item:hover .cg-icon,
      .cg-shield-item:hover .cg-shield,
      .cg-flag-item:hover .cg-icon { transform: none !important; }
      .cg-nav-item:hover, .cg-shield-item:hover, .cg-flag-item:hover { filter: none; }
      .cg-nav-item:hover .cg-icon { stroke-width: 1.5; }
      .cg-shield-item:hover .cg-shield { stroke-width: 1.8; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cg-route, .cg-icon, .cg-shield, .cg-title, .cg-subtitle {
        animation: none !important;
        transition: none !important;
      }
      .cg-route { stroke-dashoffset: 0; }
      .cg-icon, .cg-shield, .cg-title, .cg-subtitle { opacity: 1; }
      .cg-nav-item:hover .cg-icon,
      .cg-shield-item:hover .cg-shield,
      .cg-flag-item:hover .cg-icon,
      .cg-nav-item:active .cg-icon,
      .cg-shield-item:active .cg-shield { transform: none !important; }
      .cg-nav-item, .cg-shield-item, .cg-flag-item {
        filter: none !important;
        transition: none !important;
      }
      .cg-nav-item:hover .cg-icon { stroke-width: 1.5; }
      .cg-shield-item:hover .cg-shield { stroke-width: 1.8; }
    }
  </style>

  <g>
    <!-- 跨境航线：水平横置在盾牌正上方（pathLength 归一化，便于描边生长） -->
    <path class="cg-route" pathLength="100" d="M 150 160 Q 400 100 650 160" />

    <!-- 包裹图标 -->
    <g class="cg-nav-item cg-package" transform="translate(175,140)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:0.90s">
        <rect x="-10" y="-8" width="20" height="16" rx="2" />
        <path d="M -10 -1 H 10" />
        <path d="M -2 -8 V -1" />
      </g>
    </g>

    <!-- 日本 JP -->
    <g class="cg-nav-item cg-flag-item" transform="translate(240,128)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.02s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <circle cx="0" cy="0" r="3.4" />
      </g>
    </g>

    <!-- 韩国 KR -->
    <g class="cg-nav-item cg-flag-item" transform="translate(305,120)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.14s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <circle cx="0" cy="0" r="3" />
        <path d="M -7 -5 L -3 -5 M 3 5 L 7 5" />
      </g>
    </g>

    <!-- 泰国 TH -->
    <g class="cg-nav-item cg-flag-item" transform="translate(370,116)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.26s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <path d="M -10 -2.5 H 10 M -10 2.5 H 10" />
      </g>
    </g>

    <!-- 德国 DE -->
    <g class="cg-nav-item cg-flag-item" transform="translate(435,116)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.38s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <path d="M -10 -2.3 H 10 M -10 2.3 H 10" />
      </g>
    </g>

    <!-- 英国 GB -->
    <g class="cg-nav-item cg-flag-item" transform="translate(500,120)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.50s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <path d="M 0 -7 V 7 M -10 0 H 10" />
      </g>
    </g>

    <!-- 美国 US -->
    <g class="cg-nav-item cg-flag-item" transform="translate(565,128)">
      <rect class="cg-hit-area" x="-24" y="-21" width="48" height="42" rx="8" />
      <g class="cg-icon" style="animation-delay:1.62s">
        <rect x="-10" y="-7" width="20" height="14" rx="2" />
        <rect x="-10" y="-7" width="9" height="7" rx="1" />
        <path d="M 2 -2 H 10 M 2 2 H 10" />
      </g>
    </g>

    <!-- 盾牌：位于航线正下方居中 -->
    <g class="cg-shield-item" transform="translate(400,230)">
      <rect class="cg-hit-area" x="-38" y="-44" width="76" height="94" rx="12" />
      <path class="cg-shield" d="M 0 -34 L 28 -24 V 4 C 28 22 14 32 0 38 C -14 32 -28 22 -28 4 V -24 Z" />
    </g>

    <!-- 主标题与副标题 -->
    <text class="cg-title" x="400" y="322">CargoGuard</text>
    <text class="cg-subtitle" x="400" y="350">Cross-border After-sale RAG Agent</text>
  </g>
</svg>
