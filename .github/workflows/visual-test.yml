name: Visual Test

on:
  pull_request:
    branches: [main]

jobs:
  playwright-visual:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Start Streamlit in background
        run: |
          nohup python -m streamlit run streamlit_app.py \
            --server.port 8501 \
            --server.headless true \
            --browser.gatherUsageStats false \
            > streamlit.log 2>&1 &
          npx --yes wait-on http://localhost:8501 --timeout 120000

      - name: Run Playwright tests
        run: |
          if [ -f tests/order-card.spec.ts-snapshots/order-card-linux.png ]; then
            npx playwright test
          else
            echo "No baseline snapshot found, generating it for the first time."
            npx playwright test --update-snapshots
            echo "::notice::Baseline generated. Download the playwright-snapshots artifact and commit it so later runs compare against it."
          fi

      - name: Upload snapshot baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/**/*-snapshots/**
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Stop Streamlit
        if: always()
        run: pkill -f "streamlit run" || true
