name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 streamlit_app.py app

      - name: Compile all Python files
        run: python -m compileall -q streamlit_app.py app

      - name: Run agent unit tests
        run: python tests/test_agent_features.py

      - name: Review rule-layer gate
        run: python tests/review_eval.py --rules-only --fail-on-fp

      - name: Retrieval quality gate
        run: python tests/retrieval_eval.py --min-hit-rate 0.9

      - name: Red-team gate
        run: python tests/redteam_eval.py

      - name: Memory & summary quality gate
        run: >-
          python tests/memory_eval.py
          --min-hit-rate 0.9 --min-recall 0.9
          --min-fidelity 0.85 --max-compression 0.75

      - name: Validate component HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path("components").rglob("index.html"))
          assert files, "no component html found"
          for p in files:
              text = p.read_text(encoding="utf-8")
              assert "<script>" in text and "</script>" in text, f"{p}: missing script tag"
              assert "isStreamlitMessage" in text, f"{p}: missing Streamlit bridge"
          print(f"checked {len(files)} component pages")
          PY

      - name: Streamlit HITL interaction tests
        run: python tests/test_streamlit_hitl.py

      - name: Streamlit AppTest smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("streamlit_app.py", default_timeout=180)
          at.session_state["has_booted"] = True
          at.run()
          assert not at.exception, [str(e.value) for e in at.exception]
          print("AppTest OK")
          PY

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (with observability dependencies)
        run: docker build --build-arg INSTALL_OBSERVABILITY=true -t cargoguard:ci .

      - name: Start Streamlit container
        run: |
          docker run -d --name cargoguard-ui -p 8501:8501 \
            -e SUPPORTPILOT_AGENT_DB=/tmp/agent_memory.db \
            cargoguard:ci

      - name: Verify Streamlit health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' cargoguard-ui)" != "true" ]; then
              echo "Streamlit container exited"
              exit 1
            fi
            sleep 5
          done
          echo "Streamlit health check timed out"
          exit 1

      - name: Start API container
        run: |
          docker run -d --name cargoguard-api -p 8000:8000 \
            -e SUPPORTPILOT_AGENT_DB=/tmp/agent_memory.db \
            cargoguard:ci \
            uvicorn app.api:app --host 0.0.0.0 --port 8000

      - name: Verify API health and metrics
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/metrics; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' cargoguard-api)" != "true" ]; then
              echo "API container exited"
              exit 1
            fi
            sleep 5
          done
          echo "API health check timed out"
          exit 1

      - name: Show container logs
        if: always()
        run: |
          docker logs cargoguard-ui || true
          docker logs cargoguard-api || true

      - name: Clean up containers
        if: always()
        run: docker rm -f cargoguard-ui cargoguard-api || true

  e2e:
    name: e2e 回归（LLM Judge，仅 main，需配置 API key）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tests
    # 只在 main 分支推送时跑：PR 不消耗真实模型额度，也避免 judge 抖动卡住合并
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Judge 是模型、判定存在抖动（见 README §10）：e2e 失败不阻断绿，报告照常上传供人工查看
    continue-on-error: true
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: End-to-end regression with LLM judge
        if: env.OPENAI_API_KEY != '' || env.DEEPSEEK_API_KEY != ''
        run: python auto_regress.py

      - name: Skip notice (no API key configured)
        if: env.OPENAI_API_KEY == '' && env.DEEPSEEK_API_KEY == ''
        run: echo "未配置 OPENAI_API_KEY / DEEPSEEK_API_KEY，跳过真实端到端回归（不再以 dry-run 冒充通过）。在仓库 Settings → Secrets and variables → Actions 配置任一即可启用。"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/*.md
